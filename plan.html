<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAN — Kế hoạch Booking | SITC Đình Vũ CFS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f0f4f8;--s1:#fff;--s2:#f8fafc;--s3:#e2e8f0;
  --border:#e2e8f0;--border2:#cbd5e1;--r:8px;
  --blue:#2563eb;--blue-l:#eff6ff;--blue-m:#bfdbfe;
  --green:#16a34a;--red:#dc2626;--amber:#d97706;--purple:#7c3aed;
  --txt:#1e293b;--txt2:#475569;--txt3:#94a3b8;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;min-height:100vh}
.topbar{background:#0f172a;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:17px;font-weight:700}
.topbar .sub{font-size:12px;color:#94a3b8;margin-left:auto}
.wrap{padding:20px 24px;max-width:1900px;margin:0 auto}

.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.stat-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat-num{font-size:22px;font-weight:700;line-height:1.1}
.stat-lbl{font-size:11px;color:var(--txt3);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.stat-card.c-total .stat-num{color:var(--txt)}
.stat-card.c-done .stat-num{color:var(--green)}
.stat-card.c-loaded .stat-num{color:var(--blue)}
.stat-card.c-loading .stat-num{color:var(--amber)}
.stat-card.c-waiting .stat-num{color:var(--purple)}
.stat-card.c-cancel .stat-num{color:var(--red)}

.today-bar{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;font-size:13px;color:var(--txt2);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.today-bar b{color:var(--txt)}

.section-title{font-size:14px;font-weight:700;color:var(--txt);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-hint{font-size:12px;color:var(--txt3);font-weight:400}

.toolbar{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.finp{background:var(--s2);border:1px solid var(--border2);border-radius:var(--r);padding:8px 12px;font-size:13px;color:var(--txt);outline:none}
.finp:focus{border-color:var(--blue)}
#search{flex:1;min-width:200px}
.btn{padding:8px 14px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:#1d4ed8}
.btn-o{background:transparent;color:var(--txt2);border:1px solid var(--border2)}.btn-o:hover{background:var(--s3)}
.btn[disabled]{opacity:.6;cursor:default}

.tbl-wrap{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:auto;max-height:68vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th{padding:8px 8px;text-align:left;font-size:10.5px;font-weight:700;color:var(--txt3);background:#f8fafc;border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;z-index:2}
td{padding:7px 8px;border-bottom:1px solid #f1f5f9;white-space:nowrap;color:var(--txt2);max-width:180px;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#f8fafc}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;display:inline-block}
.b-done{background:#dcfce7;color:#15803d}
.b-loaded{background:#dbeafe;color:#1d4ed8}
.b-loading{background:#ffedd5;color:#c2410c}
.b-waiting{background:#ede9fe;color:#6d28d9}
.b-pending{background:#fef9c3;color:#a16207}
.b-cancel{background:#fee2e2;color:#b91c1c}
.b-picked{background:#f1f5f9;color:#475569}
.b-empty{background:#f1f5f9;color:#94a3b8}
.u-overdue{background:#fee2e2;color:#b91c1c}
.u-urgent{background:#fed7aa;color:#c2410c}
.u-critical{background:#fef3c7;color:#b45309}
.u-attention{background:#fef9c3;color:#a16207}
.u-normal{background:#dcfce7;color:#15803d}

.row-picked td{background:#f1f5f9}
.row-pending td{background:#fefce8}
.row-loading td{background:#fff7ed}
.row-waiting td{background:#faf5ff}
.row-loaded td{background:#eff6ff}
.row-done td{background:#f0fdf4}
.row-cancel td{background:#fef2f2}

.empty-state{text-align:center;color:var(--txt3);padding:36px;font-size:13px}
.toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;z-index:100;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:#b91c1c}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <h1>📅 PLAN — Kế hoạch Booking</h1>
  <div class="sub" id="last-update"></div>
</div>

<div class="wrap">

  <div class="stats">
    <div class="stat-card c-total"><div class="stat-num" id="st-cntr">–</div><div class="stat-lbl">Containers</div></div>
    <div class="stat-card c-total"><div class="stat-num" id="st-booking">–</div><div class="stat-lbl">Bookings</div></div>
    <div class="stat-card c-done"><div class="stat-num" id="st-done">–</div><div class="stat-lbl">✅ Hoàn thành</div></div>
    <div class="stat-card c-loaded"><div class="stat-num" id="st-loaded">–</div><div class="stat-lbl">📦 Đã đóng</div></div>
    <div class="stat-card c-loading"><div class="stat-num" id="st-loading">–</div><div class="stat-lbl">🔄 Đang đóng</div></div>
    <div class="stat-card c-waiting"><div class="stat-num" id="st-waiting">–</div><div class="stat-lbl">⏳ Chờ tác nghiệp</div></div>
  </div>

  <div class="today-bar" id="today-bar">Đang tải dữ liệu từ Google Sheets...</div>

  <div class="toolbar">
    <input class="finp" id="search" placeholder="🔍 Tìm booking, cont, shipper, vessel..." oninput="renderResults()">
    <select class="finp" id="f-status" onchange="renderResults()">
      <option value="">Tất cả trạng thái</option>
      <option>Hoàn thành</option><option>Đã đóng hàng</option><option>Đang đóng hàng</option>
      <option>Chờ tác nghiệp</option><option>Chờ đóng hàng</option><option>Đã lấy vỏ</option><option>Hủy</option>
    </select>
    <select class="finp" id="f-urgency" onchange="renderResults()">
      <option value="">Tất cả mức độ</option>
      <option>Quá Hạn</option><option>Gấp</option><option>Khẩn Cấp</option><option>Cần Chú Ý</option><option>Bình Thường</option>
    </select>
    <button class="btn btn-o" onclick="exportExcel()">📥 Xuất Excel</button>
    <button class="btn btn-p" id="reload-btn" onclick="reloadAll()">🔄 Tải lại</button>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>Shipper</th><th>Line</th><th>ETD</th><th>Cutoff</th><th>Booking No.</th><th>Cntr</th>
          <th>Type</th><th>Vessel</th><th>POD</th><th>Mức độ</th><th>Trạng thái</th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="11"><div class="empty-state">Đang tải dữ liệu...</div></td></tr></tbody>
    </table>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// Cầu nối Google Apps Script — trả về dữ liệu SỐNG của đúng 1 sheet (theo gid),
// Sheet gốc vẫn hoàn toàn riêng tư, chỉ nhận JSON đã xử lý sẵn qua script này.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-rRQeqkEV01c2pHt825LbPnratfmBYoVsKlvn9dnQxWanwVvqyH0cyW54CecHDBFcyw/exec';

let allRows = [];

function notif(msg, cls){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (cls==='err' ? ' err' : '');
  t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 3500);
}

function fmtDateVN(iso){ if(!iso) return '—'; const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; }

// ── Trạng thái (khớp đúng công thức Excel gốc) ──
function computeStatus(clp, cd, cntr){
  clp = (clp||'').trim().toUpperCase();
  if(clp==='X') return 'Hủy';
  if(clp==='F' && cd) return 'Hoàn thành';
  if(clp==='F') return 'Đã đóng hàng';
  if(clp==='NF') return 'Chờ tác nghiệp';
  if(clp==='CF') return 'Đang đóng hàng';
  if(clp==='OK') return 'Chờ đóng hàng';
  if(cntr) return 'Đã lấy vỏ';
  return '';
}
function statusBadgeClass(s){
  return {'Hoàn thành':'b-done','Đã đóng hàng':'b-loaded','Đang đóng hàng':'b-loading',
    'Chờ tác nghiệp':'b-waiting','Chờ đóng hàng':'b-pending','Hủy':'b-cancel','Đã lấy vỏ':'b-picked'}[s] || 'b-empty';
}
function rowTintClass(s){
  return {'Đã lấy vỏ':'picked','Chờ đóng hàng':'pending','Đang đóng hàng':'loading',
    'Chờ tác nghiệp':'waiting','Đã đóng hàng':'loaded','Hoàn thành':'done','Hủy':'cancel'}[s] || 'none';
}

// ── Mức độ khẩn cấp (giờ làm việc CFS còn lại tới Cutoff) ──
function isoWeekday(d){ const w=d.getDay(); return w===0?7:w; }
function startOfDay(d,h,m){ const x=new Date(d); x.setHours(h,m||0,0,0); return x; }
function dateOnly(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }

function computeMucDo(cutoffDateISO, cutoffTimeStr, status, nowDate){
  if(status==='Hoàn thành' || status==='Hủy') return '';
  if(!cutoffDateISO || !cutoffTimeStr) return '';
  const m = String(cutoffTimeStr).replace('H',':').match(/(\d{1,2}):(\d{2})/);
  if(!m) return '';
  const hh = +m[1], mm = +m[2];
  let cutoff = new Date(cutoffDateISO); cutoff.setHours(hh, mm, 0, 0);

  if(isoWeekday(cutoff) === 7){
    cutoff = new Date(cutoff); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(11,30,0,0);
  }

  const now = nowDate || new Date();
  const dowNow = isoWeekday(now);
  const tNow = (now.getHours()*3600+now.getMinutes()*60+now.getSeconds())/86400;
  let nowEff = new Date(now);

  if(dowNow===7){
    if(tNow < 8.5/24) nowEff = startOfDay(now,8,30);
    else if(tNow > 11.5/24){ nowEff = startOfDay(now,8,0); nowEff.setDate(nowEff.getDate()+1); }
  } else if(dowNow===6){
    if(tNow > 17.25/24){ nowEff = startOfDay(now,8,30); nowEff.setDate(nowEff.getDate()+2); }
    else if(tNow < 8/24) nowEff = startOfDay(now,8,0);
  } else {
    if(tNow < 8/24) nowEff = startOfDay(now,8,0);
    else if(tNow > 17.25/24){
      const nextDay = new Date(now); nextDay.setDate(nextDay.getDate()+1);
      const nextIsSun = isoWeekday(nextDay)===7;
      nowEff = startOfDay(now, 8, nextIsSun?30:0);
      nowEff.setDate(nowEff.getDate()+1);
    }
  }

  const days = Math.round((dateOnly(cutoff) - dateOnly(nowEff)) / 86400000);
  const dowStart = isoWeekday(nowEff);
  const dayEnd = dowStart===7 ? startOfDay(nowEff,11,30) : startOfDay(nowEff,17,15);
  const cappedEnd = Math.min(dayEnd.getTime(), cutoff.getTime());
  const hToday = Math.max(0, (cappedEnd - nowEff.getTime())/3600000);

  let sunCount=0, satCount=0;
  const n = Math.max(1, days);
  for(let i=0;i<n;i++){
    const d = new Date(dateOnly(nowEff)); d.setDate(d.getDate()+i);
    const dow = isoWeekday(d);
    if(dow===7) sunCount++; if(dow===6) satCount++;
  }
  const midDays = days - sunCount - satCount;
  const hMid = days===0 ? 0 : (midDays*9.25 + satCount*3);

  const dowEnd = isoWeekday(cutoff);
  const cutoffFrac = (cutoff.getHours()*3600+cutoff.getMinutes()*60)/86400;
  const startFrac = dowEnd===7 ? 8.5/24 : 8/24;
  const hLast = days===0 ? 0 : Math.max(0, (cutoffFrac-startFrac)*24);

  const totalH = hToday + hMid + hLast;
  if(totalH < 0) return 'Quá Hạn';
  if(totalH <= 4) return 'Gấp';
  if(totalH <= 8) return 'Khẩn Cấp';
  if(totalH <= 12) return 'Cần Chú Ý';
  return 'Bình Thường';
}
function urgencyBadgeClass(u){
  return {'Quá Hạn':'u-overdue','Gấp':'u-urgent','Khẩn Cấp':'u-critical','Cần Chú Ý':'u-attention','Bình Thường':'u-normal'}[u] || '';
}

// ── LOAD (từ Google Apps Script — dữ liệu SỐNG, không qua Supabase/Import nữa) ──
async function loadAll(){
  const res = await fetch(APPS_SCRIPT_URL);
  const data = await res.json();
  if(data.error){ notif('Lỗi tải dữ liệu: '+data.error, 'err'); return; }
  allRows = data.rows || [];
  document.getElementById('last-update').textContent = 'Cập nhật: ' + new Date().toLocaleString('vi-VN');
  recomputeDerived();
  renderStats();
  renderResults();
}

function recomputeDerived(){
  const now = new Date();
  allRows.forEach(r => {
    r._status = computeStatus(r.clp, r.cd, r.cntr_no);
    r._urgency = computeMucDo(r.cutoff_date, r.cutoff_time, r._status, now);
  });
}

function renderStats(){
  const withCntr = allRows.filter(r=>r.cntr_no);
  const uniqBookings = new Set(allRows.filter(r=>r.booking_no).map(r=>r.booking_no));
  let done=0, loaded=0, loading=0, waiting=0;
  const todayStr = new Date().toISOString().slice(0,10);
  let tDone=0, tLoaded=0, tLoading=0, tWaiting=0, tTotal=0;
  allRows.forEach(r=>{
    const st = r._status;
    if(st==='Hoàn thành') done++;
    if(st==='Đã đóng hàng') loaded++;
    if(st==='Đang đóng hàng') loading++;
    if(st==='Chờ tác nghiệp') waiting++;
    if(r.d_date === todayStr && ['Hoàn thành','Đã đóng hàng','Đang đóng hàng','Chờ tác nghiệp'].includes(st)){
      tTotal++;
      if(st==='Hoàn thành') tDone++;
      if(st==='Đã đóng hàng') tLoaded++;
      if(st==='Đang đóng hàng') tLoading++;
      if(st==='Chờ tác nghiệp') tWaiting++;
    }
  });
  document.getElementById('st-cntr').textContent = withCntr.length.toLocaleString();
  document.getElementById('st-booking').textContent = uniqBookings.size.toLocaleString();
  document.getElementById('st-done').textContent = done.toLocaleString();
  document.getElementById('st-loaded').textContent = loaded.toLocaleString();
  document.getElementById('st-loading').textContent = loading.toLocaleString();
  document.getElementById('st-waiting').textContent = waiting.toLocaleString();
  document.getElementById('today-bar').innerHTML =
    `📅 Hôm nay <b>${new Date().toLocaleDateString('vi-VN')}</b> — Đóng tổng số <b>${tTotal}</b> Cont, trong đó: ` +
    `✅ <b>${tDone}</b> hoàn thành &nbsp; 📦 <b>${tLoaded}</b> đã đóng &nbsp; 🔄 <b>${tLoading}</b> đang đóng &nbsp; ⏳ <b>${tWaiting}</b> chờ tác nghiệp`;
}

function renderResults(){
  const q = (document.getElementById('search').value||'').trim().toLowerCase();
  const fStatus = document.getElementById('f-status').value;
  const fUrgency = document.getElementById('f-urgency').value;
  const tbody = document.getElementById('tbody');

  let rows = allRows;
  if(q) rows = rows.filter(r => [r.shipper,r.booking_no,r.cntr_no,r.vessel,r.line,r.pol].some(v=>String(v||'').toLowerCase().includes(q)));
  if(fStatus) rows = rows.filter(r=>r._status===fStatus);
  if(fUrgency) rows = rows.filter(r=>r._urgency===fUrgency);

  if(!rows.length){
    tbody.innerHTML = `<tr><td colspan="11"><div class="empty-state">Không có dòng nào khớp</div></td></tr>`;
    return;
  }

  const shown = rows;
  tbody.innerHTML = shown.map(r => `
    <tr class="row-${rowTintClass(r._status)}">
      <td>${r.shipper||'—'}</td>
      <td>${r.line||'—'}</td>
      <td>${r.etd?fmtDateVN(r.etd):'—'}</td>
      <td>${r.cutoff_time||''} ${r.cutoff_date?fmtDateVN(r.cutoff_date):''}</td>
      <td><b>${r.booking_no||'—'}</b></td>
      <td>${r.cntr_no||'—'}</td>
      <td>${r.cont_type||'—'}</td>
      <td>${r.vessel||'—'}</td>
      <td>${r.pod||'—'}</td>
      <td>${r._urgency?`<span class="badge ${urgencyBadgeClass(r._urgency)}">${r._urgency}</span>`:'—'}</td>
      <td>${r._status?`<span class="badge ${statusBadgeClass(r._status)}">${r._status}</span>`:'—'}</td>
    </tr>
  `).join('');
}

// Nút "Tải lại": đọc lại dữ liệu sống từ Apps Script (mất vài giây, có báo hiệu
// đang tải) + ép khung Google Sheets nhúng tải lại nội dung mới nhất.
async function reloadAll(){
  const btn = document.getElementById('reload-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Đang tải...';
  try{
    await loadAll();
    notif('✅ Đã cập nhật dữ liệu mới nhất');
  }catch(err){
    notif('Lỗi tải dữ liệu: '+err.message, 'err');
  }
  btn.disabled = false;
  btn.innerHTML = '🔄 Tải lại';
}

function exportExcel(){
  if(!allRows.length) return;
  const rows = [['Shipper','Line','ETD','Cutoff Time','Cutoff Date','Booking No.','Cntr','Seal','Seal Cus','Type','Empty Pickup','P.O.L','Vessel','CLP','Remark','CD','T/S Port','POD','D','W','M','Mức độ','Trạng thái']];
  allRows.forEach(r=>{
    rows.push([r.shipper,r.line,r.etd,r.cutoff_time,r.cutoff_date,r.booking_no,r.cntr_no,r.seal,r.seal_cus,r.cont_type,
      r.empty_pickup,r.pol,r.vessel,r.clp,r.remark,r.cd,r.ts_port,r.pod,r.d_date,r.w_week,r.m_month,r._urgency,r._status]);
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = Array(23).fill({wch:14});
  XLSX.utils.book_append_sheet(wb, ws, 'Plan');
  XLSX.writeFile(wb, `PLAN_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// Tự làm mới Mức độ mỗi phút (phụ thuộc giờ hiện tại) — không gọi lại Apps Script,
// chỉ tính lại trên dữ liệu đã có sẵn trong bộ nhớ.
setInterval(()=>{ recomputeDerived(); renderStats(); renderResults(); }, 60000);

loadAll();
</script>
</body>
</html>
